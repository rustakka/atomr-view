name: Release

# Releases are tagged from `main`. Push a tag matching `v*` (e.g.
# `v0.2.0`, `v1.0.0-rc.1`) to fire this pipeline. The bump-and-tag
# step is automated by `.github/workflows/version-bump.yml` (see the
# "version-bump" Claude skill at ~/.claude/skills/version-bump/).
#
# This workflow:
#   1. Runs the release gate (`cargo xtask verify`) so a tag never
#      ships an untested build.
#   2. Builds Python wheels for Linux x86_64/aarch64 (glibc + musl),
#      macOS universal2, and Windows x86_64.
#   3. Builds a Python sdist.
#   4. Creates the GitHub Release with the wheels + sdist attached.
#   5. Publishes the publishable Rust crates to crates.io.
#   6. Publishes wheels + sdist to PyPI via trusted publishing.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish + maturin upload with --dry-run; skip GitHub Release upload"
        required: false
        default: "true"
      skip_python:
        description: "Skip the Python wheel build/publish jobs"
        required: false
        default: "false"
      skip_crates:
        description: "Skip the crates.io publish job"
        required: false
        default: "false"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: Verify (release gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: cargo xtask verify
        run: cargo xtask verify

  build-wheels:
    name: Build wheels (${{ matrix.target }} / ${{ matrix.os }})
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.skip_python != 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Linux glibc + musl, x86_64 + aarch64. maturin uses
          # manylinux/musllinux containers under the hood; the
          # `manylinux: auto` flag picks the right base image.
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            python-target: x86_64
            manylinux: auto
          # aarch64 Linux glibc — built natively on a GitHub-hosted
          # ARM runner so we don't have to cross-compile heavy native
          # deps inside the x86_64 manylinux container.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            python-target: aarch64
            manylinux: auto
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            python-target: x86_64
            manylinux: musllinux_1_2
          # aarch64 Linux musl — also native ARM, mirroring glibc.
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-musl
            python-target: aarch64
            manylinux: musllinux_1_2
          # macOS — universal2 yields a single fat wheel covering
          # both x86_64 and arm64 architectures.
          - os: macos-latest
            target: universal2-apple-darwin
            python-target: universal2
            manylinux: "off"
          # Windows.
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            python-target: x64
            manylinux: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels (maturin)
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.python-target }}
          # Build a wheel per supported CPython ABI on this platform.
          args: --release --strip --out dist --interpreter "python3.10 python3.11 python3.12 python3.13"
          # `auto` builds inside a manylinux container; `off` runs natively.
          manylinux: ${{ matrix.manylinux }}
      - uses: actions/upload-artifact@v4
        with:
          name: atomr-view-wheels-${{ matrix.target }}
          path: dist/*.whl

  build-sdist:
    name: Build sdist (Python)
    needs: verify
    if: github.event_name == 'push' || github.event.inputs.skip_python != 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: atomr-view-sdist
          path: dist/*.tar.gz

  github-release:
    name: GitHub Release
    needs: [verify, build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Generate release notes
        id: notes
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # The two most recent tags; use HEAD as a fallback for the first release.
          prev=$(git tag --sort=-creatordate | grep -v "^${tag}$" | head -n1 || true)
          range="${prev:+$prev..}HEAD"
          {
            echo "## atomr-view ${tag}"
            echo
            echo "### Changes"
            git log --no-merges --pretty=format:'- %s (%h)' "${range}"
            echo
            echo
            echo "### Python wheels"
            ls artifacts | grep "atomr-view-wheels-" | sed 's/^/- /' || true
          } > RELEASE_NOTES.md
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.notes.outputs.tag }}
          name: atomr-view ${{ steps.notes.outputs.tag }}
          body_path: RELEASE_NOTES.md
          prerelease: ${{ contains(steps.notes.outputs.tag, '-') }}
          files: |
            artifacts/**/*.tar.gz
            artifacts/**/*.whl

  publish-crates:
    name: Publish to crates.io
    needs: [verify, github-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.skip_crates != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
    permissions:
      contents: read
    env:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # Walk every publishable crate in dependency order. Each
      # `cargo publish` waits briefly for the index to become visible
      # before moving on, so the next crate can resolve its
      # path-dependencies from crates.io. `already uploaded` is
      # treated as success so a partially-completed run can be
      # safely retried by re-tagging.
      - name: Publish all crates in dep order
        run: |
          set -euo pipefail
          publish_one() {
            local crate=$1
            local attempt=1
            while true; do
              echo "==> publishing $crate (attempt $attempt)"
              local out
              if out=$(cargo publish -p "$crate" 2>&1); then
                printf '%s\n' "$out"
                # Throttle between successful new-crate publishes.
                sleep 30
                return 0
              fi
              printf '%s\n' "$out"
              if printf '%s' "$out" | grep -qE "already (uploaded|exists)"; then
                echo "    (already on crates.io — continuing)"
                return 0
              fi
              if printf '%s' "$out" | grep -qE "(429|Too Many Requests|rate.*limit)" && [ $attempt -lt 6 ]; then
                local delay=$((90 * attempt))
                echo "    (rate-limited — sleeping ${delay}s before retry)"
                sleep "$delay"
                attempt=$((attempt + 1))
                continue
              fi
              return 1
            done
          }
          # Strict dep-order: core → backends. atomr-view-python is
          # not published to crates.io (cdylib only — shipped as a
          # PyPI wheel by `publish-pypi`).
          for crate in atomr-view-core atomr-view-backends; do
            publish_one "$crate"
          done

  publish-crates-dry-run:
    name: Publish to crates.io (dry run)
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Dry-run publish
        run: |
          for c in atomr-view-core atomr-view-backends; do
            echo "==> $c"
            cargo publish -p "$c" --dry-run --allow-dirty || true
          done

  publish-pypi:
    name: Publish wheels + sdist to PyPI
    needs: [verify, build-wheels, build-sdist, github-release]
    runs-on: ubuntu-latest
    if: |
      startsWith(github.ref, 'refs/tags/v') &&
      github.event.inputs.skip_python != 'true' &&
      (github.event_name == 'push' ||
       (github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'true'))
    # Trusted publishing — configure on PyPI: pypi.org → manage project →
    # publishing → add GitHub publisher (owner / repo / workflow / env).
    environment:
      name: pypi
      url: https://pypi.org/p/atomr-view
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          # Only Python artifacts. The wheel + sdist artifact buckets
          # are the only `*.whl` / `*.tar.gz` producers in this
          # workflow, so the pattern is exhaustive.
          pattern: "atomr-view-{wheels-*,sdist}"
      - name: Flatten wheel + sdist artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          ls -la upload/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          # If trusted publishing is not yet configured, set
          # `password: ${{ secrets.PYPI_API_TOKEN }}` instead.
          skip-existing: true

  publish-pypi-dry-run:
    name: PyPI dry-run (TestPyPI)
    needs: [build-wheels, build-sdist]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run == 'true' && github.event.inputs.skip_python != 'true'
    environment:
      name: testpypi
      url: https://test.pypi.org/p/atomr-view
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: "atomr-view-{wheels-*,sdist}"
      - name: Flatten wheel + sdist artifacts
        run: |
          mkdir -p upload
          find dist -type f \( -name "*.whl" -o -name "*.tar.gz" \) -exec cp {} upload/ \;
          ls -la upload/
      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          repository-url: https://test.pypi.org/legacy/
          skip-existing: true
